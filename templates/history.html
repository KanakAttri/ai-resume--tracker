
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Analysis History</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="container">
    <header class="top">
        <div>
            <p class="eyebrow">SAVED ANALYSES</p>
            <h1>Resume Analysis History</h1>
        </div>
        <a href="{{ url_for('index') }}">New Analysis</a>
    </header>

    <section class="card">
        {% if analyses %}
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Resume</th>
                        <th>Job Title</th>
                        <th>Skill Match</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody>
                    {% for row in analyses %}
                    <tr>
                        <td>{{ row["filename"] }}</td>
                        <td>{{ row["job_title"] }}</td>
                        <td>{{ row["score"] }}%</td>
                        <td>{{ row["created_at"] }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% else %}
            <p>No saved analyses yet.</p>
        {% endif %}
    </section>
</main>
</body>
</html>
